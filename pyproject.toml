[project]
name = "qtilab"
version = "0.1.0"
description = "Batched, device-agnostic QTI fitting and tensor-valued diffusion simulation in PyTorch"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy",
    "torch",
    "nibabel",
    "zuko>=1.2",
    "click>=8.1",
]

[project.scripts]
qtilab = "qtilab.cli:main"

[project.optional-dependencies]
validate = ["dipy>=1.9", "cvxpy>=1.4", "scipy", "matplotlib"]

[dependency-groups]
dev = ["pytest", "dipy>=1.9", "cvxpy>=1.4", "scipy", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qtilab"]

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "qtilab/_docs/README.md"     # for `qtilab docs` in an installed copy
"docs/guide.md" = "qtilab/_docs/guide.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
